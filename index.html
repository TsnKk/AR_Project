<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>WebAR Demo</title>
  <style>
    /* 🔧 รีเซ็ตค่าเริ่มต้นของหน้า */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #181c20;
    }

    /* 🎥 จัดตำแหน่งกล้องและ Canvas ให้เต็มจอ */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 🧾 กล่องแสดงข้อมูล */
    #info-box {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      max-height: 35vh; /* จำกัดความสูง */
      overflow-y: auto; /* ให้เลื่อนทั้งกล่อง */
      background: rgba(30, 32, 36, 0.98);
      font-family: 'Sarabun', Arial, sans-serif;
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
      z-index: 10;
      pointer-events: auto; /* ให้ scroll และคลิกได้ */
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      box-sizing: border-box;
      color: #fff;
      font-size: 1.1rem;
      letter-spacing: 0.01em;
      scrollbar-width: thin;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      padding: 0; /* เอา padding-top ออก */
    }
    #info-box.has-data {
      text-align: left;
      padding-left: 24px;
      padding-right: 24px;
    }
    #info-box::-webkit-scrollbar {
      width: 8px;
    }
    #info-box::-webkit-scrollbar-thumb {
      background: #23262b;
      border-radius: 8px;
    }
    #scan-again-btn {
      width: 100%;
      border-radius: 12px 12px 0 0;
      border: none;
      background: #5a5d62; /* สีเทาอ่อนขึ้น */
      color: #fff;
      font-size: 1.1rem;
      font-family: 'Sarabun', Arial, sans-serif;
      font-weight: bold;
      padding: 14px 0;
      cursor: pointer;
      box-shadow: none;
      z-index: 11;
      position: relative;
      transition: background 0.2s;
    }
    #scan-again-btn:hover,
    #scan-again-btn:active,
    #scan-again-btn:focus {
      background: #00c896; /* สีเขียวเมื่อ hover */
    }
    /* ⏩ ปุ่มเข้าโหมด AR */
    #ar-btn {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: #00c896;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      transition: background 0.2s;
    }
    #ar-btn:hover {
      background: #009e74;
    }
    @media (max-width: 600px) {
      #info-box {
        font-size: 1rem;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- 🟢 Loading Screen -->
  <div id="loading-screen" style="
    position:fixed;top:0;left:0;width:100vw;height:100vh;
    background:#181c20;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;font-size:1.5rem;font-family:'Sarabun',Arial,sans-serif;">
    <div style="font-size:2rem;font-weight:bold;margin-bottom:24px;">WebAR Demo</div>
    <div style="margin-bottom:16px;">กำลังโหลด...</div>
    <div id="loading-bar-bg" style="width:220px;height:16px;background:#23262b;border-radius:8px;overflow:hidden;">
      <div id="loading-bar" style="width:0%;height:100%;background:#00c896;transition:width 0.3s;"></div>
    </div>
  </div>
  
  <!-- 🎥 วิดีโอแสดงภาพจากกล้อง -->
  <video id="video" autoplay muted playsinline></video>

  <!-- 🖼️ พื้นที่เรนเดอร์โมเดล 3D -->
  <canvas id="canvas"></canvas>

  <!-- ⏩ ปุ่มเข้าโหมด AR -->
  <button id="ar-btn">👓 ดูโมเดลในโลกจริง (AR)</button>

  <!-- 🧾 กล่องแสดงข้อมูลโมเดลหลังสแกน QR -->
  <div id="info-box">
    <button id="scan-again-btn">สแกนใหม่</button>
    <div id="info-content">
      สแกน QR Code เพื่อดูรายละเอียดโมเดล
    </div>
  </div>

  <!-- 🔍 โหลดไลบรารี ZXing สำหรับสแกน QR Code -->
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>

  <!-- ⚙️ โหลดสคริปต์หลัก (ใช้โมดูล JavaScript) -->
  <script type="module" src="./app.js"></script>

  <script>
    // 🟢 ฟังก์ชันเปลี่ยนข้อความ info-box (ให้ app.js เรียกใช้)
    window.setInfoBox = function(text) {
      document.getElementById('info-content').innerHTML = text;
    }

    // 🟢 Loading bar animation
    let progress = 0;
    const bar = document.getElementById('loading-bar');
    const interval = setInterval(() => {
      progress += Math.random() * 10 + 5; // เพิ่มทีละ 5-15%
      if (progress > 100) progress = 100;
      bar.style.width = progress + '%';
      if (progress >= 100) clearInterval(interval);
    }, 200);

    // 🟢 รออย่างน้อย 2200ms ก่อนซ่อน loading screen
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 2200);
    });
  </script>
</body>
</html>
