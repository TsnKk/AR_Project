<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>WebAR Demo</title>
  <style>
    /* 🔧 รีเซ็ตค่าเริ่มต้นของหน้า */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #181c20;
    }

    /* 🎥 จัดตำแหน่งกล้องและ Canvas ให้เต็มจอ */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 🧾 กล่องแสดงข้อมูล */
    /* ลบ #info-box ออก เพราะไม่ได้ใช้ */

    #info-message {
      position: fixed;
      left: 0;
      right: 0;
      bottom: env(safe-area-inset-bottom, 0);
      width: 100vw;
      max-width: 100vw;
      border-radius: 0;
      z-index: 10;
      margin: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
      background: rgba(30,32,36,0.95);
      color: #fff;
      padding: 18px 32px;
      border-radius: 12px 12px 0 0;
      font-size: 1.1rem;
      max-height: 35vh;
      overflow-y: auto;
      text-align: left;
      font-family: 'Sarabun', Arial, sans-serif;
      box-sizing: border-box;
    }
    #info-message::-webkit-scrollbar {
      width: 8px;
    }
    #info-message::-webkit-scrollbar-thumb {
      background: #23262b;
      border-radius: 8px;
    }
    #scan-again-btn {
      display: none !important;
    }
    /* ⏩ ปุ่มเข้าโหมด AR */
    #ar-btn {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: #00c896;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      transition: background 0.2s;
    }
    #ar-btn:hover {
      background: #009e74;
    }
    /* ❓ ปุ่มช่วยเหลือ */
    #floating-help-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      background: #23262b;
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      font-size: 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: background 0.2s;
    }
    #floating-help-btn:hover {
      background: #00c896;
    }
    @media (max-width: 600px) {
      #info-message {
        font-size: 1rem;
        padding: 12px 8px;
        width: calc(100vw - 16px);
        max-width: 100vw;
      }
    }

    #loading-screen {
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background:#181c20;
      z-index: 9999;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:1.5rem;
      font-family:'Sarabun',Arial,sans-serif;
    }
    #loading-screen .title {
      font-size:2rem;
      font-weight:bold;
      margin-bottom:24px;
    }
    #loading-screen .message {
      margin-bottom:16px;
    }
    #loading-bar-bg {
      width:220px;
      height:16px;
      background:#23262b;
      border-radius:8px;
      overflow:hidden;
    }
    #loading-bar {
      width:0%;
      height:100%;
      background:#00c896;
      transition:width 0.3s;
    }
  </style>
</head>
<body>
  <!-- 🟢 Loading Screen -->
  <div id="loading-screen">
    <div class="title">WebAR Demo</div>
    <div class="message">กำลังโหลด...</div>
    <div id="loading-bar-bg">
      <div id="loading-bar"></div>
    </div>
  </div>
  
  <!-- 🎥 วิดีโอแสดงภาพจากกล้อง -->
  <video id="video" autoplay muted playsinline></video>

  <!-- 🖼️ พื้นที่เรนเดอร์โมเดล 3D -->
  <canvas id="canvas"></canvas>

  <!-- ⏩ ปุ่มเข้าโหมด AR -->
  <button id="ar-btn">👓 ดูโมเดลในโลกจริง (AR)</button>

  <!-- ❓ ปุ่มช่วยเหลือ -->
  <!-- <button id="floating-help-btn" title="ช่วยเหลือ">❓</button> -->

  <!-- 🧾 กล่องแสดงข้อมูลโมเดลหลังสแกน QR (อยู่ด้านล่างและแสดงข้อความทั้งหมด) -->
  <div id="info-message">
    <div id="info-content">
      สแกน QR Code เพื่อดูรายละเอียดโมเดล
    </div>
    <div id="scroll-arrow" style="display:none;">&#8595;</div>
  </div>

  <!-- 🔍 โหลดไลบรารี ZXing สำหรับสแกน QR Code -->
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>

  <!-- ⚙️ โหลดสคริปต์หลัก (ใช้โมดูล JavaScript) -->
  <script type="module" src="./app.js"></script>

  <script>
    // 🟢 ฟังก์ชันเปลี่ยนข้อความ info-box (ให้ app.js เรียกใช้)
    window.setInfoBox = function(text) {
      document.getElementById('info-content').innerHTML = text;
    }

    // 🟢 Loading bar animation
    let progress = 0;
    const bar = document.getElementById('loading-bar');
    const interval = setInterval(() => {
      progress += Math.random() * 10 + 5; // เพิ่มทีละ 5-15%
      if (progress > 100) progress = 100;
      bar.style.width = progress + '%';
      if (progress >= 100) clearInterval(interval);
    }, 200);

    // 🟢 รออย่างน้อย 2200ms ก่อนซ่อน loading screen
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 2200);
    });
  </script>
</body>
</html>
