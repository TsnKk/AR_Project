<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>WebAR Demo</title>

  <style>
    /* 🔧 รีเซ็ตค่าเริ่มต้นของหน้า */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #181c20;
    }

    /* 🎥 จัดตำแหน่งกล้องและ Canvas ให้เต็มจอ */
    video, canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 🧾 กล่องแสดงข้อมูล */
    #info-box {
  position: fixed;
  bottom: 0;
  left: 50%; /* ✅ จัดให้กรอบอยู่ตรงกลางแนวนอน */
  transform: translateX(-50%); /* ✅ เลื่อนกรอบกลับมาครึ่งหนึ่งของตัวเอง */
  width: 100%;
  max-width: 500px;             /* ✅ จำกัดความกว้างไม่ให้กว้างเกิน */
  background: rgba(30, 32, 36, 0.98);
  padding: 16px;
  font-family: 'Sarabun', Arial, sans-serif;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.2);
  z-index: 10;
  pointer-events: none;
  border-top-left-radius: 12px;
  border-top-right-radius: 12px;
  box-sizing: border-box;
  color: #fff;
  font-size: 1.1rem;
  text-align: center;
  letter-spacing: 0.01em;
}
    @media (max-width: 600px) {
      #info-box {
        font-size: 1rem;
        padding: 10px;
      }
    }

    /* ⏩ ปุ่มเข้าโหมด AR */
    #ar-btn {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: #00c896;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: none;
      transition: background 0.2s;
    }

    #ar-btn:hover {
      background: #009e74;
    }

    /* ปุ่มสำหรับสแกน QR Code ใหม่ */
    #scan-again-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  background: rgba(30, 32, 36, 0.98);
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 12px 32px;
  font-size: 1.1rem;
  font-family: 'Sarabun', Arial, sans-serif;
  font-weight: bold;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: background 0.2s;
}
#scan-again-btn:hover {
  background: #23262b;
}
  </style>
</head>
<body>
  
  <!-- ปุ่มสำหรับสแกน QR Code ใหม่ -->
<button id="scan-again-btn" style="position:fixed;top:10px;right:10px;z-index:10;">
  สแกนใหม่
</button>


  <!-- 🎥 วิดีโอแสดงภาพจากกล้อง -->
  <video id="video" autoplay muted playsinline></video>

  <!-- 🖼️ พื้นที่เรนเดอร์โมเดล 3D -->
  <canvas id="canvas"></canvas>

  <!-- ⏩ ปุ่มเข้าโหมด AR -->
  <button id="ar-btn">👓 ดูโมเดลในโลกจริง (AR)</button>

  <!-- 🧾 กล่องแสดงข้อมูลโมเดลหลังสแกน QR -->
  <div id="info-box">
    สแกน QR Code เพื่อดูรายละเอียดโมเดล
  </div>

  <!-- 🔍 โหลดไลบรารี ZXing สำหรับสแกน QR Code -->
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>

  <!-- ⚙️ โหลดสคริปต์หลัก (ใช้โมดูล JavaScript) -->
  <script type="module" src="./app.js"></script>


    // ตัวอย่าง: เปลี่ยนข้อความ info-box (ให้ app.js เรียกใช้)
    window.setInfoBox = function(text) {
      document.getElementById('info-box').textContent = text;
    }
  </script>
</body>
</html>
